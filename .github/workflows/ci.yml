name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      NODE_ENV: test
      PORT: 4000
      MONGODB_URI: mongodb://127.0.0.1:27017/worknest_ci
      JWT_ACCESS_SECRET: ci_placeholder_secret_at_least_32_chars_long
      ACCESS_TOKEN_TTL: 15m
      CLIENT_ORIGIN: http://localhost:5173
      BCRYPT_COST: 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run screens:check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: e2e/test-results
